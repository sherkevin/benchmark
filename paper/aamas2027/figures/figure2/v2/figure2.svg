<svg id="figure2" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
  <title id="title">Delayed selected-only feedback lifecycle</title>
  <desc id="desc">Three swim lanes show a provider selection at decision tick t, a selected only call and terminal outcome, a delay queue, release at tau t, state update, and the next action. An unselected output is ghosted and marked not observed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#475467"/></marker>
    <marker id="arrow-light" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M 0 0 L 12 6 L 0 12 z" fill="#7c8798"/></marker>
  </defs>
  <rect x="14" y="14" width="1472" height="672" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="52" y="62" class="stage">Delayed selected-only feedback</text>
  <text x="52" y="94" class="small">Selected released outcome changes the next state.</text>
  <line x1="52" y1="124" x2="1450" y2="124" class="divider"/>

  <text x="52" y="200" class="lane-label">SELECTOR</text>
  <text x="52" y="367" class="lane-label">PROVIDER / VERIFIER</text>
  <text x="52" y="546" class="lane-label">UPDATER</text>

  <text x="282" y="153" class="stage" text-anchor="middle">decision tick t</text>
  <text x="558" y="153" class="stage" text-anchor="middle">call + terminal</text>
  <text x="845" y="153" class="stage" text-anchor="middle">delay queue D</text>
  <text x="1118" y="153" class="stage" text-anchor="middle">release at τ<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  <text x="1361" y="153" class="stage" text-anchor="middle">next action</text>

  <rect x="178" y="170" width="208" height="90" rx="14" class="ours box"/>
  <text x="282" y="207" class="label" text-anchor="middle">choose a<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  <text x="282" y="238" class="small" text-anchor="middle">menu A<tspan baseline-shift="sub" font-size="20">t</tspan></text>

  <rect x="453" y="320" width="190" height="88" rx="14" class="frozen box"/>
  <text x="548" y="356" class="label" text-anchor="middle">call a<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  <text x="548" y="386" class="small" text-anchor="middle">one call</text>

  <rect x="690" y="298" width="240" height="132" rx="14" class="verify box"/>
  <text x="810" y="334" class="label" text-anchor="middle">terminal event</text>
  <text x="810" y="367" class="small" text-anchor="middle">runtime</text>
  <text x="810" y="394" class="small" text-anchor="middle">chemical | valid</text>
  <rect x="739" y="442" width="141" height="34" rx="17" class="feedback box"/>
  <text x="810" y="465" class="tiny" text-anchor="middle">selected only</text>

  <rect x="695" y="195" width="228" height="62" rx="12" class="ghost box"/>
  <text x="809" y="223" class="small" text-anchor="middle">unselected output</text>
  <text x="809" y="245" class="tiny" text-anchor="middle">not observed</text>
  <line x1="709" y1="209" x2="909" y2="246" stroke="#98a2b3" stroke-width="3"/>
  <line x1="909" y1="209" x2="709" y2="246" stroke="#98a2b3" stroke-width="3"/>
  <path d="M 810 257 L 810 293" class="dash-arrow"/>

  <rect x="748" y="502" width="194" height="82" rx="14" class="feedback box"/>
  <text x="845" y="537" class="label" text-anchor="middle">pending event</text>
  <text x="845" y="566" class="small" text-anchor="middle">wait D</text>

  <rect x="1018" y="502" width="202" height="82" rx="14" class="verify box"/>
  <text x="1119" y="537" class="label" text-anchor="middle">release y<tspan baseline-shift="sub" font-size="16">t</tspan></text>
  <text x="1119" y="566" class="small" text-anchor="middle">at τ<tspan baseline-shift="sub" font-size="14">t</tspan></text>

  <rect x="1265" y="502" width="190" height="82" rx="14" class="ours box"/>
  <text x="1360" y="537" class="label" text-anchor="middle">update state</text>
  <text x="1360" y="566" class="small" text-anchor="middle">selected only</text>

  <line x1="282" y1="260" x2="548" y2="318" class="arrow"/>
  <line x1="643" y1="364" x2="688" y2="364" class="arrow"/>
  <path d="M 810 430 C 810 458, 845 466, 845 500" class="dash-arrow"/>
  <line x1="942" y1="543" x2="1016" y2="543" class="dash-arrow"/>
  <line x1="1220" y1="543" x2="1263" y2="543" class="arrow"/>
  <path d="M 1360 590 C 1360 640, 282 640, 282 262" class="dash-arrow"/>

  <line x1="984" y1="168" x2="984" y2="620" class="boundary"/>
  <text x="1000" y="208" class="small" fill="#9a6700">unavailable</text>
  <text x="1000" y="232" class="small" fill="#9a6700">before τ<tspan baseline-shift="sub" font-size="20">t</tspan></text>

  <text x="282" y="286" class="tiny" text-anchor="middle">visible at t</text>
  <text x="845" y="616" class="tiny" text-anchor="middle">queued; no update</text>
</svg>