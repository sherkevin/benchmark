<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">Delayed selected-only feedback</title>
  <desc id="desc">A compact two-tier lifecycle. The selector chooses one provider, the call terminates with output and runtime status, and a frozen endpoint judge supplies chemical correctness for valid returns. The terminal outcome becomes a selected outcome, waits in a selected-only queue until tau t equals t plus one plus D, is released, updates the relay state, and is visible to the first action at or after release. System failure is separate from chemical correctness.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#344054"/></marker>
    <marker id="blueArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#2E5DA1"/></marker>
    <marker id="purpleArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L12 6L0 12z" fill="#6B4C9A"/></marker>
    <style>
      .stage{font:700 23px Arial,Helvetica,sans-serif;fill:#183B63;letter-spacing:.2px}
      .title{font:700 26px Arial,Helvetica,sans-serif;fill:#183B63}
      .label{font:700 24px Arial,Helvetica,sans-serif;fill:#173B64}
      .labelWhite{font:700 23px Arial,Helvetica,sans-serif;fill:#fff}
      .body{font:400 19px Arial,Helvetica,sans-serif;fill:#344054}
      .bodyWhite{font:400 17px Arial,Helvetica,sans-serif;fill:#fff}
      .note{font:400 17px Arial,Helvetica,sans-serif;fill:#667085}
      .small{font:400 16px Arial,Helvetica,sans-serif;fill:#475467}
      .pill{fill:#E7F0FC;stroke:#6CA1DF;stroke-width:2}
      .blue{fill:#2E5DA1;stroke:#1F4B86;stroke-width:2.5}
      .gray{fill:#EEF1F5;stroke:#98A2B3;stroke-width:2.5}
      .amber{fill:#FFF0CF;stroke:#C97813;stroke-width:2.5}
      .purple{fill:#EEE8F7;stroke:#6B4C9A;stroke-width:2.5}
      .whiteBadge{fill:#fff8ea;stroke:#D8A14A;stroke-width:1.5}
      .flow{fill:none;stroke:#344054;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .flowBlue{fill:none;stroke:#2E5DA1;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blueArrow)}
      .wait{fill:none;stroke:#6B4C9A;stroke-width:3;stroke-dasharray:10 9;stroke-linecap:round;marker-end:url(#purpleArrow)}
      .thin{fill:none;stroke:#98A2B3;stroke-width:2}
    </style>
  </defs>

  <rect width="1800" height="620" fill="#fff"/>

  <!-- stage pills -->
  <rect x="34" y="24" width="220" height="48" rx="15" class="pill"/><text x="144" y="55" text-anchor="middle" class="stage">decision t</text>
  <rect x="300" y="24" width="240" height="48" rx="15" class="pill"/><text x="420" y="55" text-anchor="middle" class="stage">selected call</text>
  <rect x="610" y="24" width="300" height="48" rx="15" class="pill"/><text x="760" y="55" text-anchor="middle" class="stage">terminal</text>
  <rect x="1000" y="24" width="270" height="48" rx="15" class="pill"/><text x="1135" y="55" text-anchor="middle" class="stage">pending D</text>
  <rect x="1360" y="24" width="400" height="48" rx="15" class="pill"/><text x="1560" y="55" text-anchor="middle" class="stage">release / next action</text>

  <!-- upper action spine -->
  <rect x="34" y="120" width="130" height="78" rx="14" class="gray"/>
  <text x="99" y="167" text-anchor="middle" class="label">S<tspan baseline-shift="sub" font-size="16">t</tspan> + A<tspan baseline-shift="sub" font-size="16">t</tspan></text>

  <rect x="190" y="120" width="132" height="78" rx="14" class="blue"/>
  <text x="256" y="167" text-anchor="middle" class="labelWhite">selector</text>

  <rect x="348" y="110" width="186" height="98" rx="14" class="blue"/>
  <text x="441" y="151" text-anchor="middle" class="labelWhite">one selected</text><text x="441" y="180" text-anchor="middle" class="labelWhite">provider</text>

  <rect x="560" y="120" width="104" height="78" rx="14" class="gray"/>
  <text x="612" y="167" text-anchor="middle" class="label">call</text>

  <rect x="690" y="105" width="250" height="108" rx="15" class="amber"/>
  <text x="815" y="139" text-anchor="middle" class="label">terminal record</text>
  <rect x="710" y="153" width="94" height="40" rx="10" class="whiteBadge"/><text x="757" y="178" text-anchor="middle" class="small">output</text>
  <rect x="816" y="153" width="106" height="40" rx="10" class="whiteBadge"/><text x="869" y="178" text-anchor="middle" class="small">runtime status</text>

  <rect x="980" y="120" width="225" height="78" rx="14" class="amber"/>
  <text x="1092" y="154" text-anchor="middle" class="label">frozen endpoint</text><text x="1092" y="182" text-anchor="middle" class="label">judge</text>

  <rect x="1240" y="120" width="195" height="78" rx="14" class="amber"/>
  <text x="1337" y="154" text-anchor="middle" class="label">chemical</text><text x="1337" y="182" text-anchor="middle" class="label">correctness</text>

  <path d="M164 159H190" class="flow"/><path d="M322 159H348" class="flow"/><path d="M534 159H560" class="flow"/><path d="M664 159H690" class="flow"/><path d="M940 159H980" class="flow"/><path d="M1205 159H1240" class="flow"/>

  <!-- terminal branches and merge -->
  <rect x="920" y="252" width="185" height="58" rx="13" class="gray"/>
  <text x="1012" y="287" text-anchor="middle" class="label">system failure</text>
  <rect x="1180" y="252" width="190" height="58" rx="13" class="amber"/>
  <text x="1275" y="287" text-anchor="middle" class="label">terminal outcome</text>
  <path d="M870 213V235Q870 252 900 252H920" class="flow"/>
  <path d="M1337 198V252" class="flow"/>
  <path d="M1105 281H1180" class="flow"/>

  <!-- lower selected-only release chain -->
  <rect x="650" y="370" width="178" height="68" rx="14" class="blue"/>
  <text x="739" y="399" text-anchor="middle" class="labelWhite">selected</text><text x="739" y="425" text-anchor="middle" class="labelWhite">outcome</text>
  <rect x="865" y="360" width="230" height="88" rx="18" class="purple"/>
  <text x="980" y="394" text-anchor="middle" class="label">selected-only queue</text>
  <text x="980" y="425" text-anchor="middle" class="body">τ<tspan baseline-shift="sub" font-size="14">t</tspan> = t + 1 + D</text>
  <rect x="1132" y="370" width="165" height="68" rx="14" class="blue"/>
  <text x="1214" y="399" text-anchor="middle" class="labelWhite">released</text><text x="1214" y="425" text-anchor="middle" class="labelWhite">outcome</text>
  <rect x="1324" y="360" width="220" height="88" rx="14" class="blue"/>
  <text x="1434" y="394" text-anchor="middle" class="labelWhite">relay update</text>
  <text x="1434" y="424" text-anchor="middle" class="bodyWhite">family residual +</text><text x="1434" y="444" text-anchor="middle" class="bodyWhite">provider bias</text>
  <rect x="1570" y="370" width="100" height="68" rx="14" class="blue"/>
  <text x="1620" y="411" text-anchor="middle" class="labelWhite">S<tspan baseline-shift="sub" font-size="16">τt</tspan></text>
  <rect x="1692" y="360" width="100" height="88" rx="14" class="gray"/>
  <text x="1742" y="394" text-anchor="middle" class="small">first action</text><text x="1742" y="418" text-anchor="middle" class="small">at or after</text><text x="1742" y="440" text-anchor="middle" class="small">τ<tspan baseline-shift="sub" font-size="12">t</tspan></text>

  <path d="M1275 310V335H739V370" class="flow"/>
  <path d="M828 404H865" class="flow"/>
  <path d="M1095 404H1132" class="wait"/>
  <path d="M1297 404H1324" class="flow"/>
  <path d="M1544 404H1570" class="flow"/>
  <path d="M1670 404H1692" class="flow"/>

  <!-- pending markers -->
  <circle cx="944" cy="322" r="8" fill="#B8C0CC"/><circle cx="980" cy="322" r="8" fill="#B8C0CC"/><circle cx="1016" cy="322" r="8" fill="#B8C0CC"/>
  <text x="980" y="302" text-anchor="middle" class="small">t+1 … τ<tspan baseline-shift="sub" font-size="12">t</tspan>−1</text>
  <text x="980" y="475" text-anchor="middle" class="note">event hidden until τ<tspan baseline-shift="sub" font-size="13">t</tspan></text>

  <!-- future-state note -->
  <path d="M1620 438V510H255V198" class="flowBlue"/>
  <text x="930" y="542" text-anchor="middle" class="note" fill="#2E5DA1">future selector reads released state</text>
  <text x="1620" y="475" text-anchor="middle" class="note">D=0: visible before</text><text x="1620" y="496" text-anchor="middle" class="note">next action</text>

  <!-- small selected-only boundary note -->
  <rect x="34" y="250" width="220" height="58" rx="13" class="gray"/>
  <text x="144" y="276" text-anchor="middle" class="small">unselected output</text><text x="144" y="297" text-anchor="middle" class="small">not observed</text>
</svg>
