<!doctype html><html><head><meta charset="utf-8"><title>Figure 2 v7</title><style>html,body{margin:0;background:#fff}body{font-family:Arial,Helvetica,sans-serif}svg{display:block;width:1500px;height:700px}@media print{@page{margin:0;size:10in 4.8in}body{width:10in}svg{width:10in;height:4.6667in}}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700" role="img" aria-labelledby="title desc">
<title id="title">Delayed selected-only feedback lifecycle with independent endpoint judging</title>
<desc id="desc">Three lanes show a decision tick choosing one provider, its runtime return and independent frozen endpoint judgment, a delay queue, release of the selected label at tau t, and the next action. A crossed-out unselected output is marked not observed.</desc>
<defs>
 <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#475467"/></marker>
 <marker id="ad" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0L12 6L0 12z" fill="#7C8798"/></marker>
 <style>
  .headline{font:700 42px Arial,Helvetica,sans-serif;fill:#344054}
  .stage{font:700 40px Arial,Helvetica,sans-serif;fill:#344054}
  .lane{font:700 30px Arial,Helvetica,sans-serif;letter-spacing:1px;fill:#344054}
  .label{font:400 40px Arial,Helvetica,sans-serif;fill:#1F2937}
  .small{font:400 30px Arial,Helvetica,sans-serif;fill:#475467}
  .tiny{font:400 25px Arial,Helvetica,sans-serif;fill:#667085}
  .box{stroke-width:3}
  .blue{fill:#E5EEFB;stroke:#2E5DA1}.gray{fill:#EEF1F5;stroke:#98A2B3}
  .amber{fill:#FFF2D9;stroke:#D99000}.purple{fill:#EEE8F7;stroke:#6B4C9A}
  .ghost{fill:#FAFAFA;stroke:#B8C0CC;stroke-dasharray:10 9}
  .solid{stroke:#475467;stroke-width:4;fill:none;marker-end:url(#a)}
  .dashed{stroke:#7C8798;stroke-width:3.5;fill:none;stroke-dasharray:11 9;marker-end:url(#ad)}
  .divider{stroke:#D0D5DD;stroke-width:2}.boundary{stroke:#D99000;stroke-width:3;stroke-dasharray:11 10}
 </style>
</defs>
<rect x="14" y="14" width="1472" height="672" rx="18" fill="#fff" stroke="#D0D5DD" stroke-width="2"/>
<text x="55" y="66" class="headline">Delayed selected-only feedback</text>
<text x="55" y="105" class="small">One selected outcome becomes usable only after its release tick.</text>
<line x1="55" y1="130" x2="1445" y2="130" class="divider"/>
<text x="54" y="214" class="lane">SELECT</text>
<text x="54" y="390" class="lane">CALL / VERIFY</text>
<text x="54" y="570" class="lane">UPDATER</text>
<text x="315" y="166" class="stage" text-anchor="middle">DECIDE t</text>
<text x="585" y="166" class="stage" text-anchor="middle">CALL</text>
<text x="855" y="166" class="stage" text-anchor="middle">QUEUE</text>
<text x="1115" y="166" class="stage" text-anchor="middle">RELEASE</text>
<text x="1360" y="166" class="stage" text-anchor="middle">NEXT</text>

<rect x="205" y="185" width="220" height="105" rx="15" class="blue box"/>
<text x="315" y="230" class="label" text-anchor="middle">choose a<tspan baseline-shift="sub" font-size="26">t</tspan></text>
<text x="315" y="268" class="small" text-anchor="middle">menu A<tspan baseline-shift="sub" font-size="21">t</tspan></text>
<text x="315" y="318" class="tiny" text-anchor="middle">visible at t</text>

<rect x="485" y="332" width="200" height="105" rx="15" class="gray box"/>
<text x="585" y="378" class="label" text-anchor="middle">call a<tspan baseline-shift="sub" font-size="26">t</tspan></text>
<text x="585" y="414" class="small" text-anchor="middle">one call</text>

<rect x="730" y="286" width="300" height="150" rx="15" class="purple box"/>
<text x="880" y="333" class="label" text-anchor="middle">terminal event</text>
<text x="880" y="372" class="small" text-anchor="middle">runtime status</text>
<text x="880" y="408" class="small" text-anchor="middle">provider output</text>
<text x="880" y="432" class="tiny" text-anchor="middle">frozen endpoint judge</text>
<rect x="800" y="456" width="160" height="42" rx="21" class="amber box"/>
<text x="880" y="485" class="small" text-anchor="middle">selected only</text>

<rect x="758" y="188" width="245" height="68" rx="12" class="ghost box"/>
<text x="880" y="221" class="small" text-anchor="middle">unselected output</text>
<text x="880" y="248" class="tiny" text-anchor="middle">not observed</text>
<line x1="772" y1="200" x2="989" y2="245" stroke="#98A2B3" stroke-width="3"/><line x1="989" y1="200" x2="772" y2="245" stroke="#98A2B3" stroke-width="3"/>


<rect x="750" y="520" width="220" height="90" rx="15" class="amber box"/>
<text x="860" y="560" class="label" text-anchor="middle">queue</text>
<text x="860" y="594" class="small" text-anchor="middle">wait D</text>
<rect x="1035" y="520" width="200" height="90" rx="15" class="purple box"/>
<text x="1135" y="560" class="label" text-anchor="middle">release y<tspan baseline-shift="sub" font-size="26">t</tspan></text>
<text x="1135" y="594" class="small" text-anchor="middle">at τ<tspan baseline-shift="sub" font-size="22">t</tspan></text>
<rect x="1280" y="520" width="180" height="90" rx="15" class="blue box"/>
<text x="1370" y="560" class="label" text-anchor="middle">update</text>
<text x="1370" y="594" class="small" text-anchor="middle">next action</text>

<line x1="425" y1="238" x2="485" y2="355" class="solid"/>
<line x1="685" y1="385" x2="730" y2="360" class="solid"/>
<path d="M880 436L860 518" class="dashed"/>
<line x1="970" y1="565" x2="1035" y2="565" class="dashed"/>
<line x1="1235" y1="565" x2="1280" y2="565" class="solid"/>
<path d="M1370 620C1370 660 315 660 315 292" class="dashed"/>
<line x1="1008" y1="500" x2="1008" y2="640" class="boundary"/>
<text x="1023" y="455" class="small" fill="#9A6700">no feedback</text>
<text x="1023" y="490" class="small" fill="#9A6700">before τ<tspan baseline-shift="sub" font-size="22">t</tspan></text>
<text x="860" y="646" class="tiny" text-anchor="middle">queued; no update</text>
</svg></body></html>
